<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Site oficial de Ciel Santos. Página em construção.">
  <title>Ciel Santos</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f7fa;
      color: #1f2937;
    }

    main {
      width: min(680px, 90%);
      text-align: center;
      background: #ffffff;
      padding: 56px 32px;
      border-radius: 16px;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(2rem, 6vw, 3.2rem);
      letter-spacing: -1px;
    }

    .subtitle {
      margin: 0 0 28px;
      font-size: 1.05rem;
      color: #6b7280;
    }

    .message {
      margin: 0 auto 34px;
      max-width: 500px;
      line-height: 1.7;
      color: #4b5563;
    }

    .status {
      display: inline-block;
      padding: 9px 18px;
      border: 1px solid #d1d5db;
      border-radius: 999px;
      font-size: 0.9rem;
      color: #374151;
      background: #f9fafb;
    }

    footer {
      margin-top: 38px;
      font-size: 0.82rem;
      color: #9ca3af;
    }
  </style>
</head>

<body>

  <main>
    <h1>Ciel Santos</h1>

    <p class="subtitle">
      Projetos • Educação • Tecnologia
    </p>

    <p class="message">
      Bem-vindo ao meu site.<br>
      Este espaço está em construção e em breve terá novidades.
    </p>

    <span class="status">
      Site em construção
    </span>

    <footer>
      © 2026 Ciel Santos
    </footer>
  </main>

</body>
</html>
